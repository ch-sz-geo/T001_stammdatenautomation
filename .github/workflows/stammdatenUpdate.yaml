name: Detect Stammdaten Changes

on:
  push:
    branches: [ main, master ]
    paths:
      - "data/stammdaten.xtf"
  pull_request:
    branches: [ main, master ]
    paths:
      - "data/stammdaten.xtf"
  workflow_dispatch:

permissions:
  contents: write   # needed to commit the updated AsciiDoc

env:
  XTF_FILE: data/stammdaten.xtf
  ADOC_FILE: data/readme.adoc     # AsciiDoc containing the table
  ROW_DESCRIPTION: "Diese Datei enthält die Stammdaten des Datenmodells {model}."

jobs:
  compare-model:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # current + prior commit

      - name: Compare model / Stammdaten BID with prior commit
        id: compare
        shell: bash
        run: |
          set -euo pipefail

          # Tab-separated output, namespace-agnostic:
          #   ILI    <2.3|2.4>
          #   MODEL  <name>   (2.3: <MODEL NAME=>, 2.4: <ili:model>)
          #   BASKET <bid>    (2.3: <Model.Stammdaten BID=>, 2.4: <Stammdaten ili:bid=>)
          extract_info() {
            python3 -c '
          import sys
          import xml.etree.ElementTree as ET

          def local(name):
              return name.split("}")[-1]

          root = ET.parse(sys.stdin.buffer).getroot()
          ns = root.tag.partition("}")[0].lstrip("{")

          if "2.4" in ns:
              ili = "2.4"
          elif "2.3" in ns:
              ili = "2.3"
          else:
              sys.exit("::error::Cannot determine INTERLIS version from root namespace: " + repr(ns))

          print("ILI", ili, sep="\t")
          for el in root.iter():
              tag = local(el.tag)

              # Model name
              if ili == "2.3" and tag == "MODEL":
                  print("MODEL", el.get("NAME", ""), sep="\t")
              elif ili == "2.4" and tag == "model" and (el.text or "").strip():
                  print("MODEL", el.text.strip(), sep="\t")

              # Stammdaten basket: "Stammdaten" (2.4) or "<Model>.Stammdaten" (2.3)
              if tag == "Stammdaten" or tag.endswith(".Stammdaten"):
                  for k, v in el.attrib.items():
                      if local(k).lower() == "bid":
                          print("BASKET", v, sep="\t")
          '
          }

          if [ ! -f "$XTF_FILE" ]; then
            echo "::error::$XTF_FILE not found in current commit"
            exit 1
          fi

          extract_info < "$XTF_FILE" | sort > "$RUNNER_TEMP/current.txt"

          if ! grep -q $'^BASKET\t' "$RUNNER_TEMP/current.txt"; then
            echo "::error::No Stammdaten basket with a BID found in $XTF_FILE"
            exit 1
          fi

          if git rev-parse --verify -q HEAD~1 >/dev/null \
             && git cat-file -e "HEAD~1:$XTF_FILE" 2>/dev/null; then
            git show "HEAD~1:$XTF_FILE" | extract_info | sort > "$RUNNER_TEMP/previous.txt"
          else
            echo "::notice::No prior version of $XTF_FILE found; treating as new file"
            : > "$RUNNER_TEMP/previous.txt"
          fi

          echo "Previous commit:"; cat "$RUNNER_TEMP/previous.txt"
          echo "Current commit:";  cat "$RUNNER_TEMP/current.txt"

          # Human-readable one-liner for the step summary
          fmt() {
            awk -F'\t' '
              $1=="ILI"    { printf "INTERLIS %s: ", $2; next }
              $1=="MODEL"  { out = out (out ? ", " : "") $2 }
              $1=="BASKET" { out = out (out ? ", " : "") $2 }
              END { print out }
            ' "$1" | tr -d '\n'
          }

          {
            echo "### XTF comparison (\`$XTF_FILE\`)"
            echo
            echo "| | Previous (HEAD~1) | Current (HEAD) |"
            echo "|---|---|---|"
            echo "| Version / Model / BID | $(fmt "$RUNNER_TEMP/previous.txt") | $(fmt "$RUNNER_TEMP/current.txt") |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if diff -u "$RUNNER_TEMP/previous.txt" "$RUNNER_TEMP/current.txt" > "$RUNNER_TEMP/model.diff"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "**Model / Stammdaten BID is unchanged compared to the prior commit.**" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Model name and Stammdaten BID unchanged compared to the prior commit (HEAD~1)"
            exit 1
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "**Model / Stammdaten BID changed:**"
              echo '```diff'
              cat "$RUNNER_TEMP/model.diff"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Append row to table in AsciiDoc
        # Only on real pushes (a PR checkout is a detached merge commit we cannot push to)
        if: github.event_name != 'pull_request' && steps.compare.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          export FILE_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/${XTF_FILE}"
          export INFO_FILE="$RUNNER_TEMP/current.txt"

          python3 - <<'PY'
          import os, re, sys

          adoc = os.environ["ADOC_FILE"]
          url = os.environ["FILE_URL"]

          ili, models, baskets = None, [], []
          for line in open(os.environ["INFO_FILE"], encoding="utf-8").read().splitlines():
              parts = line.split("\t")
              kind = parts[0]
              if kind == "ILI":
                  ili = parts[1]
              elif kind == "MODEL":
                  models.append(parts[1])
              elif kind == "BASKET":
                  baskets.append(parts[1])

          # Gültigkeit = date at the end of the BID, e.g. ...Stammdaten.2000-01-01
          m = re.search(r"(\d{4}-\d{2}-\d{2})$", baskets[0]) if baskets else None
          if not m:
              print(f"::error::No YYYY-MM-DD date at the end of BID '{baskets[0] if baskets else ''}'")
              sys.exit(1)
          valid_from = m.group(1)

          model_cell = " +\n".join(models)
          description = os.environ["ROW_DESCRIPTION"].format(model=", ".join(models))

          with open(adoc, encoding="utf-8") as f:
              text = f.read()

          if url in text:
              print("Row for this commit already present, nothing to do.")
              sys.exit(0)

          row = (
              f"| {model_cell}\n"
              f"| {valid_from}\n"
              f"| {description}\n"
              f"| {url}[*Datei*]\n"
          )

          lines = text.splitlines(keepends=True)
          start = next(i for i, l in enumerate(lines) if l.strip() == "|===")  # opening table delimiter

          # number of columns from [cols="..."] above the table (fallback: 4)
          ncols = 4
          if start > 0:
              mc = re.search(r'cols="([^"]*)"', lines[start - 1])
              if mc:
                  ncols = len(mc.group(1).split(","))

          # skip the header row (it may span several lines): count cell separators
          pos, seen = start + 1, 0
          while pos < len(lines) and seen < ncols:
              seen += lines[pos].count("|")
              pos += 1

          lines.insert(pos, row)  # newest entry directly below the header

          with open(adoc, "w", encoding="utf-8") as f:
              f.write("".join(lines))
          print(f"Appended row to {adoc} (INTERLIS {ili})")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ADOC_FILE"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Dateibeschreibung: Gültigkeit/Modell aus ${XTF_FILE} ergänzt"
            git pull --rebase
            git push
          fi
